<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie - Learning Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <section class="hero">
            <div class="badge">AI Learning Assistant</div>
            <h1>EduGenie</h1>
            <p>Google Gemini Powered Learning Assistant</p>
        </section>

        <section class="card">
            <label for="task">Choose a learning task</label>
            <select id="task">
                <option value="qa">Ask a Question</option>
                <option value="explain">Explain a Topic</option>
                <option value="quiz">Generate Quiz</option>
                <option value="summarize">Summarize Text</option>
                <option value="learn">Recommend Learning Path</option>
            </select>

            <label for="inputText">Enter your topic, question, or text</label>
            <textarea id="inputText" rows="9" placeholder="Type here..."></textarea>

            <button id="submitBtn" type="button">Generate</button>
            <p id="status" class="status"></p>
        </section>

        <section class="card result-card">
            <div class="result-header">
                <h2>Result</h2>
                <button id="copyBtn" class="secondary" type="button">Copy</button>
            </div>
            <div id="result" class="result">
                Your AI-generated learning result will appear here.
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
